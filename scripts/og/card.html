<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('../../src/fonts/inter-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('../../src/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Gaegu'; font-weight: 700; src: url('../../src/fonts/gaegu-latin-700-normal.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #0a0a0a; overflow: hidden; }
  body { position: relative; font-family: 'JetBrains Mono', monospace; color: #e8e8e8; }
  .banner {
    position: absolute; inset: 0 0 auto 0; height: 300px;
    background: url('../../public/banner/banner-poster.png') center bottom / cover no-repeat;
    image-rendering: pixelated;
  }
  .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, #0a0a0a); }
  .avatar {
    position: absolute; left: 72px; top: 196px; width: 150px; height: 150px; border-radius: 50%;
    object-fit: cover; box-shadow: 0 0 0 4px #0a0a0a, 0 0 0 6px rgba(168,236,255,.6);
  }
  .text { position: absolute; left: 72px; right: 72px; top: 372px; }
  h1 { font-family: 'Inter'; font-weight: 700; font-size: 76px; line-height: 1.05; letter-spacing: -0.01em; }
  h1 i { display: inline-block; width: .28em; height: .28em; margin-left: .15em; background: #a8ecff; }
  p { margin-top: 18px; font-size: 28px; line-height: 1.45; color: #e8e8e8; }
  p u { text-decoration: none; background: linear-gradient(#a8ecff, #a8ecff) left bottom / 100% 3px no-repeat; padding-bottom: 4px; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; color: #8a8a8a; }
  .foot b { color: #e8e8e8; font-weight: 400; }
  .chalk { font-family: 'Gaegu'; font-weight: 700; font-size: 30px; color: #a8ecff; }
</style>
</head>
<body>
  <div class="banner"></div>
  <img class="avatar" src="../../src/assets/avatar.jpg" alt="" />
  <div class="text">
    <h1>Ayush Sharma<i></i></h1>
    <p>I build systems end to end and <u>ship them to production</u>.</p>
  </div>
  <div class="foot">
    <span><b>ayush64.me</b> · ALFRED · Git Lingo · Dossier</span>
    <span class="chalk">@ayush__64</span>
  </div>
</body>
</html>
